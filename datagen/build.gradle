plugins {
    id 'java'
    alias(nyfs.plugins.mdg.loader)
    id 'multiloader-datagen'
}

repositories {
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven { url = 'https://jm.gserv.me/repository/maven-public/' }
    maven { url = 'https://maven.theillusivec4.top/' }
}

dependencies {
    implementation "mysticdrew:common-networking-neoforge:${common_network_version}"
    implementation nyfs.config.api.neoforge
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

plugins {
    id 'multiloader-loader'
    alias(nyfs.plugins.loom.loader)
    id 'multiloader-fabric'
    id 'com.nyfaria.moddingtools.publishing'
}

dependencies {
    api nyfs.config.api.fabric
    include nyfs.config.api.fabric
    implementation include("mysticdrew:common-networking-fabric:${common_network_version}")
    implementation "maven.modrinth:trinkets-updated:${trinkets_version}"
}

modPublishing {
    file = tasks.named('jar').flatMap { it.archiveFile }
}

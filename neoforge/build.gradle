plugins {
    id 'multiloader-loader'
    alias(nyfs.plugins.mdg.loader)
    alias(nyfs.plugins.regutils.loader)
    id 'multiloader-moddev'
    id 'com.nyfaria.moddingtools.publishing'
}

repositories {
    maven { url = 'https://maven.wispforest.io/releases' }
    maven { url = 'https://jm.gserv.me/repository/maven-public/' }
    maven { url = 'https://maven.su5ed.dev/releases' }
}

dependencies {
    jarJar(implementation('mysticdrew:common-networking-neoforge')) {
        version {
            strictly "[${common_network_version},)"
            prefer common_network_version
        }
    }
    implementation("io.wispforest:accessories-neoforge:${accessories_version}")
    implementation "curse.maven:forgified-fabric-api-889079:6370322"
}

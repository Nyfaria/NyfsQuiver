plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id "me.modmuss50.mod-publish-plugin" version "0.5.1"
}


neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            // -XX:+AllowEnhancedClassRedefinition only exists on the JetBrains Runtime (used by
            // IntelliJ), so passing it unconditionally makes the run tasks fail on any other JDK.
            // Force it with -PenhancedClassRedefinition=true.
            def supportsEnhancedRedefinition = System.getProperty('java.vm.vendor', '')
                    .toLowerCase().contains('jetbrains') || project.hasProperty('enhancedClassRedefinition')
            jvmArguments = supportsEnhancedRedefinition ? ["-XX:+AllowEnhancedClassRedefinition"] : []
        }
        client {
            client()
        }
        data {
            data()
//            programArgument = ['--mod', mod_id '--all', '--output', project(":common").file('src/generated/resources/').getAbsolutePath(), '--existing', project(":common").file('src/main/resources/').getAbsolutePath()]
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', rootProject.project(":common").file('src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.project(":common").file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    jarJar(implementation('mysticdrew:common-networking-neoforge')) {
        version {
            strictly "[${common_network_version},)"
            prefer common_network_version
        }
    }
    // Accessory libraries are soft dependencies on NeoForge: the quiver can be worn in a Curios
    // slot, in an Accessories slot, or in neither if the player has no accessory mod installed.
    // Both are compile-only from the player's point of view (nothing is bundled), and every
    // Accessories API access is guarded by a mod-loaded check, so the mod also boots with just
    // one of them. Swap the Accessories line for runtimeOnly/implementation to test its slots
    // in a development run.
    compileOnly("io.wispforest:accessories-neoforge:${project.accessories_version}")
    implementation("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    implementation "curse.maven:forgified-fabric-api-889079:6370322"
}
sourceSets.main.resources { srcDir '../common/src/generated/resources' }

publishMods {
    if(publishForge.toBoolean()) {
        file = jar.archiveFile
        changelog = project(":common").file("changelog.md").text
        type = STABLE
        modLoaders.add("neoforge")
        displayName = "${mod_name}-${minecraft_version}-[NeoForge]-${project.version}"
        dryRun = dry_run.toBoolean()
        if (curseforge_publishing_enabled.toBoolean() && project.hasProperty('curseforge_token')) {
            curseforge {
                projectId = curseforge_project_id
                accessToken = curseforge_token
                minecraftVersions.add(minecraft_version)
                minecraftVersions.add("1.21")
            }
        }
        if (modrinth_publishing_enabled.toBoolean() && project.hasProperty('modrinth_token')) {
            modrinth {
                accessToken = modrinth_token
                projectId = modrinth_project_id
                minecraftVersions.add(minecraft_version)
                minecraftVersions.add("1.21")
            }
        }
    }
}